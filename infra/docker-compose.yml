services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: mco
    ports:
      - "5432:5432"
    volumes:
      - mco_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d mco"]
      interval: 5s
      timeout: 5s
      retries: 10

  migrate:
    build:
      context: ../backend
    command: ["alembic", "upgrade", "head"]
    environment:
      MCO_DATABASE_URL: postgresql+asyncpg://postgres:postgres@postgres:5432/mco
      MCO_MIGRATION_DATABASE_URL: postgresql+psycopg://postgres:postgres@postgres:5432/mco
    depends_on:
      postgres:
        condition: service_healthy

  seed:
    build:
      context: ../backend
    command: ["python", "-m", "app.scripts.seed_demo"]
    environment:
      MCO_DATABASE_URL: postgresql+asyncpg://postgres:postgres@postgres:5432/mco
      MCO_MIGRATION_DATABASE_URL: postgresql+psycopg://postgres:postgres@postgres:5432/mco
    depends_on:
      migrate:
        condition: service_completed_successfully

  backend:
    build:
      context: ../backend
    environment:
      MCO_ENVIRONMENT: development
      MCO_DATABASE_URL: postgresql+asyncpg://postgres:postgres@postgres:5432/mco
      MCO_MIGRATION_DATABASE_URL: postgresql+psycopg://postgres:postgres@postgres:5432/mco
      MCO_CORS_ORIGINS: http://localhost:5173,http://localhost:3000,http://127.0.0.1:5173
    ports:
      - "8000:8000"
    depends_on:
      seed:
        condition: service_completed_successfully

  frontend:
    build:
      context: ..
      dockerfile: frontend/Dockerfile
    ports:
      - "5173:80"
    depends_on:
      backend:
        condition: service_healthy

  n8n:
    image: docker.n8n.io/n8nio/n8n:2.38.2
    environment:
      N8N_EXPRESSION_ENGINE: vm
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY:?Set N8N_ENCRYPTION_KEY in infra/.env}
      MCO_API_BASE_URL: http://backend:8000
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
    ports:
      - "5678:5678"
    volumes:
      - mco_n8n:/home/node/.n8n
    depends_on:
      backend:
        condition: service_healthy

volumes:
  mco_postgres:
  mco_n8n:
